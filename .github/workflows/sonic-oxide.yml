# Sonic Oxide (experiments/) — Rust core + GPUI frontend test suites.
# Kept separate from the existing build.yml so the upstream Qt pipeline is
# untouched. No untrusted event data is interpolated into run commands.
name: Sonic Oxide

on:
  push:
    branches: [dev]
    paths:
      - "experiments/**"
      - ".github/workflows/sonic-oxide.yml"
  pull_request:
    paths:
      - "experiments/**"
      - ".github/workflows/sonic-oxide.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-core:
    name: rust-core (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/rust-core
      - name: Unit + integration + golden tests
        working-directory: experiments/rust-core
        run: cargo test --all-targets
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage gate (rust-core is held at >=90% lines; 95% today)
        working-directory: experiments/rust-core
        run: cargo llvm-cov --all-targets --fail-under-lines 90 --summary-only

  # Cross-platform core (plan v2): rust-core must stay green on macOS and
  # keep compiling on Windows (shm backend pending there). These runners ARE
  # the mac/win machines until real hardware shows up. Static commands only.
  rust-core-macos:
    name: rust-core (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/rust-core
      - name: Unit tests (integration/e2e need the runtime — Linux-only for now)
        working-directory: experiments/rust-core
        run: cargo test --lib

  rust-core-windows:
    name: rust-core (Windows, check only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/rust-core
      - name: Compile check (audio::shm is cfg(unix)-gated)
        working-directory: experiments/rust-core
        run: cargo check

  gpui-spike:
    name: gpui-spike (nightly, per rust-toolchain.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml in the crate dir selects the nightly channel.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/gpui-spike
      - name: GPUI Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libvulkan-dev libasound2-dev \
            libfontconfig-dev pkg-config
      - name: Tests (headless — pure helpers, vocab, a11y geometry, store)
        working-directory: experiments/gpui-spike
        run: cargo test
      # Static commands only — no workflow event data is interpolated.
      - name: i18n completeness (every source string translated in each locale)
        run: |
          python3 experiments/i18n-tools.py missing de
          python3 experiments/i18n-tools.py missing fr

  package:
    name: Linux bundle + AppImage (artifacts)
    runs-on: ubuntu-latest
    needs: [rust-core, gpui-spike]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/gpui-spike
      - name: Build deps + appimagetool
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libvulkan-dev libasound2-dev rsync ruby-full \
            libfontconfig-dev pkg-config
          curl -sL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      # Runners have no display/audio, so the boot smoke is skipped here —
      # it runs on dev machines; CI proves the artifacts assemble.
      - name: Package (artifacts only)
        env:
          SKIP_SMOKE: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1" # no FUSE on runners
        run: ./experiments/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SonicOxide-x86_64.AppImage
          path: experiments/dist/SonicOxide-x86_64.AppImage
          if-no-files-found: error
